server:
   port: 8080

spring:
  datasource:
     url: jdbc:postgresql://192.168.1.150:5432/hrms
     username: postgres
     password: ${DB_PASSWORD}

  jpa:
     properties:
       hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
          format_sql: true

       javax:
         persistence:
           validation:
             mode: none
     hibernate:
       ddl-auto: validate
       show-sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
       mail:
         smtp:
           auth: true
           starttls: 
             enable: true
cloudinary:
  api-key: ${CLOUDINARY_API_KEY}
  secret: ${CLOUDINARY_SECRET}
  cloud-name: doljmeipy
